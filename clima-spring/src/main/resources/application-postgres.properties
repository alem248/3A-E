# ---------------------------------------------------------------------------
# Perfil "postgres": PostgreSQL + PostGIS (requisito de la HU-1, tarea de BD).
#
# Uso:
#   1. Levantar la base de datos:  docker compose -f db/docker-compose.yml up -d
#   2. Arrancar la app:            mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#      o bien:                    java -jar target/clima-costero-0.0.1-SNAPSHOT.jar --spring.profiles.active=postgres
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/clima
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=clima
spring.datasource.password=clima

# Hibernate crea las tablas JPA; PostGIS agrega la columna espacial via schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ejecutar db/postgres/schema.sql despues de que Hibernate cree las tablas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/postgres/schema.sql
