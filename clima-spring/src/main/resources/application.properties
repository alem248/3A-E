server.port=8080

# Perfil por defecto: "dev" permite arrancar sin infraestructura (H2 en memoria).
spring.profiles.active=dev

# ---------------------------------------------------------------------------
# Perfil dev: base de datos H2 en memoria. Ideal para desarrollo y pruebas sin
# instalar PostgreSQL. Las zonas se cargan desde el catalogo ZonasTermicas.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:clima;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Motor de reglas de alerta.
# Cada regla: "si la TSM > temperatura-umbral (X) y la zona es zona-id (Y),
# generar una alerta de nivel (Z)". Niveles: VERDE, AMARILLO, NARANJA, ROJO.
# Si una zona cumple varias reglas, gana la de umbral mas alto.
# Zonas (ZonasTermicas): 1 Tumbes, 2 Piura Norte, 3 Piura Sur (Paita),
# 4 Lambayeque, 5 La Libertad Norte, 6 La Libertad Sur (Chimbote).
# ---------------------------------------------------------------------------
alertas.evaluacion-automatica=true
alertas.intervalo-ms=900000

alertas.reglas[0].nombre=Tumbes - peligro critico
alertas.reglas[0].zona-id=1
alertas.reglas[0].temperatura-umbral=28.0
alertas.reglas[0].nivel=ROJO
alertas.reglas[0].mensaje=TSM critica frente a Tumbes. Evite quebradas y zonas inundables y acuda al refugio mas cercano.
alertas.reglas[0].vigencia-horas=24

alertas.reglas[1].nombre=Piura Norte - peligro critico
alertas.reglas[1].zona-id=2
alertas.reglas[1].temperatura-umbral=28.0
alertas.reglas[1].nivel=ROJO
alertas.reglas[1].mensaje=TSM critica frente a Piura. Alejese de la ribera del rio y prepare su evacuacion.
alertas.reglas[1].vigencia-horas=24

alertas.reglas[2].nombre=Piura Norte - riesgo alto
alertas.reglas[2].zona-id=2
alertas.reglas[2].temperatura-umbral=26.0
alertas.reglas[2].nivel=NARANJA
alertas.reglas[2].mensaje=TSM elevada frente a Piura. Prepare su mochila de emergencia.
alertas.reglas[2].vigencia-horas=24

alertas.reglas[3].nombre=Piura Sur (Paita) - riesgo alto
alertas.reglas[3].zona-id=3
alertas.reglas[3].temperatura-umbral=27.0
alertas.reglas[3].nivel=NARANJA
alertas.reglas[3].mensaje=TSM elevada frente a Paita. Pescadores: eviten salir al mar.
alertas.reglas[3].vigencia-horas=12

alertas.reglas[4].nombre=Lambayeque - vigilancia
alertas.reglas[4].zona-id=4
alertas.reglas[4].temperatura-umbral=26.0
alertas.reglas[4].nivel=AMARILLO
alertas.reglas[4].mensaje=TSM sobre lo normal frente a Lambayeque. Mantengase atento a los comunicados.
alertas.reglas[4].vigencia-horas=12

# ---------------------------------------------------------------------------
# Ubicacion GPS del usuario: limites para aceptar una posicion.
# ---------------------------------------------------------------------------
ubicacion.precision-maxima-m=1000
ubicacion.antiguedad-maxima-horas=24
ubicacion.tolerancia-futuro-seg=300
