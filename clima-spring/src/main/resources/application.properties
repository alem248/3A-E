server.port=8080

# Perfil por defecto: "dev" permite arrancar sin infraestructura (H2 en memoria).
spring.profiles.active=dev

# ---------------------------------------------------------------------------
# Perfil dev: base de datos H2 en memoria. Ideal para desarrollo y pruebas sin
# instalar PostgreSQL. Las zonas se cargan desde el catalogo ZonasTermicas.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:clima;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
