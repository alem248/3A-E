version: "3.9"

# PostgreSQL 16 con PostGIS para el backend Spring Boot (perfil "postgres").
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: clima-postgis
    environment:
      POSTGRES_DB: clima
      POSTGRES_USER: clima
      POSTGRES_PASSWORD: clima
    ports:
      - "5432:5432"
    volumes:
      - clima_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clima -d clima"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clima_pgdata:
